# Zipsight Lab — Netlify config. Deploy this repo via "Import from Git" so the
# serverless function (netlify/functions/census.js) is published alongside the site.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Friendly alias: /api/census?zip=17322  ->  the function
[[redirects]]
  from = "/api/census"
  to = "/.netlify/functions/census"
  status = 200
